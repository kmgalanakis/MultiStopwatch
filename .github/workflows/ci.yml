name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: ./build.sh
      - name: Check the bundle
        run: |
          test -x MultiStopwatch.app/Contents/MacOS/Stopwatches
          codesign --verify --verbose MultiStopwatch.app
