name: Release

# Push a tag like v1.2.0 to create a draft GitHub release with a universal build.
# Review the draft on GitHub and publish it from there.
# Run the workflow by hand to test the build without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Build universal app bundle
        run: UNIVERSAL=1 BUILD="$GITHUB_RUN_NUMBER" ./build.sh

      - name: Package
        run: |
          ditto -c -k --keepParent MultiStopwatch.app "MultiStopwatch-$VERSION.zip"
          mkdir dmg && cp -R MultiStopwatch.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "MultiStopwatch" -srcfolder dmg -ov -format UDZO "MultiStopwatch-$VERSION.dmg"

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "MultiStopwatch-$VERSION.zip" "MultiStopwatch-$VERSION.dmg" \
            --title "MultiStopwatch $VERSION" --generate-notes --draft

      - name: Keep the build for manual runs
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: MultiStopwatch-${{ env.VERSION }}
          path: |
            MultiStopwatch-*.zip
            MultiStopwatch-*.dmg
